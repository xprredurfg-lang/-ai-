<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><text x="60" y="70" fill="#0f172a" font-size="34" font-family="Arial" font-weight="700">制造质量部门：AI 信号转化优先级</text><text x="60" y="105" fill="#475569" font-size="18" font-family="Arial">评分基于本期证据强度与制造质量可操作性，非市场预测。</text><g transform="translate(600,380)" font-family="Arial"><circle r="240" fill="none" stroke="#cbd5e1"/><circle r="180" fill="none" stroke="#cbd5e1"/><circle r="120" fill="none" stroke="#cbd5e1"/><circle r="60" fill="none" stroke="#cbd5e1"/><g stroke="#94a3b8"><line x1="0" y1="0" x2="0" y2="-250"/><line x1="0" y1="0" x2="216" y2="-125"/><line x1="0" y1="0" x2="216" y2="125"/><line x1="0" y1="0" x2="0" y2="250"/><line x1="0" y1="0" x2="-216" y2="125"/><line x1="0" y1="0" x2="-216" y2="-125"/></g><polygon points="0,-210 175,-101 147,85 0,160 -156,90 -173,-100" fill="#2563eb" opacity=".28" stroke="#2563eb" stroke-width="4"/><text x="-65" y="-275" font-size="20" fill="#0f172a">数据底座</text><text x="225" y="-130" font-size="20" fill="#0f172a">Agent 权限</text><text x="225" y="140" font-size="20" fill="#0f172a">端点安全</text><text x="-55" y="286" font-size="20" fill="#0f172a">跨App体验</text><text x="-350" y="140" font-size="20" fill="#0f172a">机器人/物流</text><text x="-360" y="-130" font-size="20" fill="#0f172a">质量计量</text></g><g font-family="Arial" font-size="18" fill="#334155"><text x="90" y="625">高优先级：行业质量数据集、AI/机器人检测的计量校准、Agent 操作审计。</text><text x="90" y="655">谨慎项：通用对话助手体验与汽车制造质量关联弱，需先找到车间可验证场景。</text></g></svg>